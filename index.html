<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f3a5f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co http://127.0.0.1:54321; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'self'">
<title>Client Checklist — Attorney</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%231f3a5f%22/%3E%3Cpath d=%22M4 8.5l2.5 2.5L12 5%22 stroke=%22white%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="app-top">
  <span class="logo">Client Checklist</span><span class="who" id="who"></span><span class="grow"></span>
  <button class="btn small hidden" id="settingsBtn">Settings</button>
  <button class="btn small hidden" id="signOut">Sign out</button>
</header>

<!-- Sign in -->
<section class="login card hidden" id="loginView">
  <h1>Sign in</h1>
  <p class="muted">We email you a one-time sign-in link. Only invited office accounts can sign in.</p>
  <form id="loginForm"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" required>
    <button class="btn primary block" style="margin-top:.8rem" type="submit">Email me a sign-in link</button></form>
  <p class="small" id="loginMsg" aria-live="polite"></p>
</section>

<main class="wrap hidden" id="appView">
  <div class="cols" id="cols">
    <aside class="clients-pane">
      <div class="card">
        <div class="row"><h2 class="grow" style="margin:0">Clients</h2><button class="btn small primary" id="newClientBtn">+ New</button></div>
        <input id="clientSearch" type="search" placeholder="Search clients…" aria-label="Search clients" style="margin:.6rem 0">
        <div id="clientList" aria-live="polite"><p class="muted small">Loading…</p></div>
      </div>
    </aside>
    <section class="detail-pane" id="detail"></section>
  </div>
</main>

<nav class="bar hidden" id="bar" aria-label="Quick actions">
  <button class="btn" id="barDictate">🎤 Dictate</button><button class="btn primary" id="barLink">Client link</button>
</nav>

<footer class="small muted" style="text-align:center;padding:1rem 0 2rem">Templates are examples for the attorney to review. Not legal advice.</footer>
<script src="vendor/supabase.js"></script>
<script src="vendor/lz-string.min.js"></script>
<script src="config.js"></script>
<script src="js/library.js"></script>
<script src="js/common.js"></script>
<script src="js/parse.js"></script>
<script src="js/attorney-app.js"></script>
</body>
</html>
